<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blend Lab</title>
<style>
  :root {
    --bg: #16171a; --panel: #1f2024; --line: #2e3036; --text: #e8e6e1; --muted: #9a978f;
    --accent: #e0b25b; --good: #7fbf7f; --bad: #d9776b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(22,23,26,.95); backdrop-filter: blur(6px);
           border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  label { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  select, input, textarea { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .note { color: var(--muted); font-size: 12px; max-width: 60ch; }
  main { padding: 16px; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; }
  .chip b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .help { color: var(--muted); font-size: 12px; margin: 0 0 16px; }
  .row { display: grid; grid-template-columns: repeat(var(--cols), minmax(220px, 1fr)); gap: 12px; padding: 16px 0; border-top: 1px solid var(--line); overflow-x: auto; }
  .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 0; }
  .cell.src { opacity: .92; }
  .cell img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #0e0f11; border-radius: 6px; cursor: zoom-in; display: block; }
  .cell .cmp { margin-top: 6px; opacity: .8; }
  .cell .cmp img { aspect-ratio: 1; }
  .tag { font-size: 11px; color: var(--muted); margin: 6px 0 2px; text-transform: uppercase; letter-spacing: .06em; }
  .title { font-size: 12px; line-height: 1.3; }
  .meta { font-size: 11px; color: var(--muted); }
  .err { color: var(--bad); font-size: 12px; padding: 20px 4px; }
  .stars { display: flex; gap: 4px; margin-top: 6px; }
  .stars button { flex: 1; background: var(--bg); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 4px 0; cursor: pointer; font: inherit; }
  .stars button.on { background: var(--accent); color: #1a1406; border-color: var(--accent); font-weight: 600; }
  .cell input { width: 100%; margin-top: 6px; font-size: 12px; }
  .saved { color: var(--good); font-size: 11px; height: 14px; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .checks span { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--bg); cursor: help; }
  .checks .ok { color: var(--good); }
  .checks .no { color: var(--bad); }
  .cands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; }
  .cands figure { margin: 0; border: 1px solid var(--line); border-radius: 4px; padding: 2px; }
  .cands figure.pick { border-color: var(--accent); }
  .cands figcaption { font-size: 10px; color: var(--muted); text-align: center; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; padding: 16px; }
  #lightbox img { max-width: 100%; max-height: 100%; }
  #overall { width: min(100%, 720px); min-height: 60px; display: block; margin: 0 0 16px; }
  @media (max-width: 600px) { .row { grid-template-columns: repeat(var(--cols), 70vw); } }
</style>
</head>
<body>
<header>
  <h1>Blend Lab</h1>
  <label>Version <select id="ver"></select></label>
  <label>Compare with <select id="cmp"><option value="">none</option></select></label>
  <span class="note" id="vnote"></span>
</header>
<main>
  <div class="summary" id="summary"></div>
  <p class="help">Rate each output 1 to 5 (5 = looks like one real painting that clearly comes from both). Add a few words on what's wrong or right; that's what drives the next version. Click an image to enlarge.</p>
  <textarea id="overall" placeholder="Overall notes on this version (what to try next, what to drop)..."></textarea>
  <div id="grid"></div>
</main>
<div id="lightbox"><img alt=""></div>
<script>
let S = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function load() {
  S = await (await fetch("/api/state")).json();
  const names = S.versions.map((v) => v.name);
  const keep = $("#ver").value || localStorage.getItem("bl.ver") || names[names.length - 1];
  $("#ver").innerHTML = names.map((n) => `<option>${esc(n)}</option>`).join("");
  $("#cmp").innerHTML = `<option value="">none</option>` + names.map((n) => `<option>${esc(n)}</option>`).join("");
  if (names.includes(keep)) $("#ver").value = keep;
  render();
}

async function save(key, patch, el) {
  S.ratings[key] = { ...(S.ratings[key] || {}), ...patch };
  await fetch("/api/rate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key, ...patch }) });
  if (el) { el.textContent = "saved"; setTimeout(() => (el.textContent = ""), 1200); }
  renderSummary();
}

function renderSummary() {
  const v = $("#ver").value;
  const per = {};
  for (const [k, r] of Object.entries(S.ratings)) {
    const [ver, m] = k.split("/");
    if (ver === v && r.score && m !== "_overall") (per[m] ||= []).push(r.score);
  }
  const ver = S.versions.find((x) => x.name === v);
  const methods = Object.keys(ver?.methods || {});
  $("#summary").innerHTML = methods.map((m) => {
    const s = per[m] || [];
    const avg = s.length ? (s.reduce((a, b) => a + b, 0) / s.length).toFixed(2) : "–";
    return `<span class="chip">${esc(m)} <b>${avg}</b> <span class="meta">(${s.length}/${ver.pairs.length})</span></span>`;
  }).join("");
}

function render() {
  const v = $("#ver").value, c = $("#cmp").value;
  try { localStorage.setItem("bl.ver", v); } catch {}
  const ver = S.versions.find((x) => x.name === v);
  const cmp = S.versions.find((x) => x.name === c && x.name !== v);
  if (!ver) { $("#grid").innerHTML = `<p class="help">No runs yet. Run: python -m blendlab run v1</p>`; return; }
  $("#vnote").textContent = `${ver.created || ""}${ver.note ? " · " + ver.note : ""}`;
  $("#overall").value = S.ratings[`${v}/_overall`]?.note || "";
  const methods = Object.keys(ver.methods);
  const art = (id, role) => {
    const a = S.artworks[id] || {};
    return `<div class="cell src"><img src="/img/${esc(id)}.jpg" alt="${esc(a.title)}"><div class="tag">${role}</div>
      <div class="title">${esc(a.title || id)}</div><div class="meta">${esc(a.artist || "")} · ${esc(a.date_display || "")}<br>${esc(a.medium || "")}</div></div>`;
  };
  $("#grid").innerHTML = ver.pairs.map((p) => {
    const cells = methods.map((m) => {
      const key = `${v}/${m}/${p.id}`, r = S.ratings[key] || {}, res = ver.results[`${m}/${p.id}`] || {};
      const body = res.ok
        ? `<img src="/runs/${esc(v)}/${esc(m)}/${esc(p.id)}.jpg?t=${encodeURIComponent(ver.created)}" alt="${esc(m)} output">`
        : `<div class="err">${esc(res.error || "not run")}</div>`;
      const ck = cmp && cmp.results[`${m}/${p.id}`]?.ok
        ? `<div class="cmp"><div class="tag">${esc(cmp.name)} · ${S.ratings[`${cmp.name}/${m}/${p.id}`]?.score ?? "–"}/5</div><img src="/runs/${esc(cmp.name)}/${esc(m)}/${esc(p.id)}.jpg" alt=""></div>` : "";
      const checks = res.checks ? `<div class="checks">${Object.entries(res.checks).map(([k, c]) =>
          `<span class="${c.pass ? "ok" : "no"}" title="${esc(JSON.stringify(c.detail))}">${c.pass ? "✓" : "✗"} ${esc(k.replace(/_/g, " "))}</span>`).join("")}</div>
        <div class="cands">${(res.candidates || []).map((cd, i) =>
          `<figure class="${cd.name === res.picked ? "pick" : ""}"><img src="/runs/${esc(v)}/${esc(m)}/${esc(p.id)}_c${i + 1}.jpg?t=${encodeURIComponent(ver.created)}" alt="${esc(cd.name)}"><figcaption>${esc(cd.name.split(" ")[0])} · ${cd.passed}/6</figcaption></figure>`).join("")}</div>` : "";
      return `<div class="cell">${body}<div class="tag">${esc(m)}${res.seconds ? " · " + res.seconds + "s" : ""}${res.picked ? " · picked " + esc(res.picked.split(" ")[0]) : ""}</div>${checks}
        <div class="stars" data-key="${esc(key)}">${[1, 2, 3, 4, 5].map((n) => `<button data-n="${n}" class="${r.score === n ? "on" : ""}">${n}</button>`).join("")}</div>
        <input data-key="${esc(key)}" placeholder="why?" value="${esc(r.note || "")}"><div class="saved"></div>${ck}</div>`;
    }).join("");
    return `<div class="row" style="--cols:${methods.length + 2}">${art(p.a, `${p.id} · A (composition)`)}${art(p.b, "B (look)")}${cells}</div>`;
  }).join("");
  renderSummary();
}

$("#grid").addEventListener("click", (e) => {
  const b = e.target.closest(".stars button");
  if (b) {
    const wrap = b.parentElement, n = +b.dataset.n, cur = S.ratings[wrap.dataset.key]?.score;
    const score = cur === n ? null : n;
    wrap.querySelectorAll("button").forEach((x) => x.classList.toggle("on", +x.dataset.n === score));
    save(wrap.dataset.key, { score }, wrap.parentElement.querySelector(".saved"));
    return;
  }
  if (e.target.tagName === "IMG") { $("#lightbox img").src = e.target.src; $("#lightbox").style.display = "flex"; }
});
$("#grid").addEventListener("change", (e) => {
  if (e.target.matches("input[data-key]")) save(e.target.dataset.key, { note: e.target.value }, e.target.nextElementSibling);
});
$("#overall").addEventListener("change", (e) => save(`${$("#ver").value}/_overall`, { note: e.target.value }));
$("#lightbox").addEventListener("click", () => ($("#lightbox").style.display = "none"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#lightbox").style.display = "none"; });
$("#ver").addEventListener("change", render);
$("#cmp").addEventListener("change", render);
load();
</script>
</body>
</html>

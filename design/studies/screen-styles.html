<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blend screen styles</title>
<!-- Mock of the app's Welcome, Quiz and Home/Lobby card in three styles.
     Only fonts that ship with iOS are used, so each style is reachable in React Native
     without installing anything. Style A mirrors the code in app/src. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #17171b; color: #ddd; font: 14px/1.4 -apple-system, sans-serif; padding: 24px 16px 60px; }
  h2 { font: 600 15px -apple-system, sans-serif; letter-spacing: .04em; margin: 34px 0 4px; color: #fff; }
  h2 small { font-weight: 400; color: #9a9aa5; margin-left: 8px; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
  .phone { width: 320px; height: 680px; border-radius: 38px; overflow: hidden; position: relative;
    padding: 46px 22px 26px; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    box-shadow: 0 0 0 7px #000, 0 0 0 8px #33333a; flex: none; }
  .sp { flex: 1; }
  .kick { font: 700 10px -apple-system, sans-serif; letter-spacing: .22em; color: var(--accent); }
  .title { font-family: var(--display); color: var(--text); }
  .dim { color: var(--dim); font-size: 15px; line-height: 23px; }
  .btn { height: 50px; border-radius: var(--btn-r); display: flex; align-items: center; justify-content: center;
    background: var(--btn); color: var(--btn-text); font: var(--btn-font); letter-spacing: var(--btn-ls);
    box-shadow: var(--btn-shadow); border: var(--btn-border); }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--frame-off); box-shadow: none; flex: 1; }
  .nav { display: flex; gap: 10px; } .nav .btn:last-child { flex: 2; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .art { aspect-ratio: 1 / 1.15; position: relative; background: var(--panel); border: var(--frame-w) solid var(--frame-off);
    padding: var(--frame-pad); border-radius: var(--frame-r); }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: var(--img-r); }
  .art.on { border-color: var(--accent); box-shadow: var(--on-shadow); }
  .art:not(.on) img { opacity: var(--off-op); }
  .check { position: absolute; right: -8px; top: -8px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent);
    color: var(--check-text); font: 800 14px -apple-system; display: grid; place-items: center; }
  .pips { display: flex; gap: 6px; margin-bottom: 16px; } .pips i { flex: 1; height: 4px; border-radius: 2px; background: var(--frame-off); }
  .pips i.on { background: var(--accent); }
  .hand { font-family: var(--hand); color: var(--dim); font-size: 17px; text-align: center; }
  .bars { display: grid; gap: 7px; } .bar { height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar b { display: block; height: 100%; background: #ff7a59; border-radius: 4px; }
  .bl { display: flex; justify-content: space-between; font-size: 11px; color: var(--card-dim); } .bl span:first-child { color: var(--card-text); font-weight: 600; font-size: 12px; }
  .thumbs { display: flex; gap: 6px; } .thumbs img { width: 46px; height: 46px; object-fit: cover; }

  /* A: night gallery */
  .A { --bg:#05060c; --panel:#0c0f1a; --text:#f1e9d8; --dim:#a29c8e; --accent:#d9b56d; --frame-off:#5c4e30;
    --display: Didot, "Bodoni 72", serif; --hand: "Bradley Hand", cursive;
    --btn:#d9b56d; --btn-text:#2a2318; --btn-font:700 12px -apple-system; --btn-ls:.2em; --btn-r:27px; --btn-shadow:0 4px 18px rgba(255,200,120,.35); --btn-border:0;
    --frame-w:2px; --frame-pad:4px; --frame-r:3px; --img-r:1px; --on-shadow:0 0 16px rgba(255,200,120,.55); --off-op:.55; --check-text:#2a2318;
    --track:#e2d6bc; --card-text:#2a2318; --card-dim:#6b5f4c; }
  .A .glow { position: absolute; left: -70px; top: 120px; width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,200,120,.2), rgba(255,200,120,.06) 45%, transparent 70%); }
  .A .rule { width: 56px; height: 1px; background: var(--accent); margin: 12px 0; }
  .A .name { border-bottom: 1px solid #5c4e30; font: 26px Didot, serif; padding: 8px 0; margin: 6px 0 14px; }
  .ticket { background: #efe6d2; color: #2a2318; border-radius: 6px; transform: rotate(-1.2deg); box-shadow: 0 10px 22px rgba(0,0,0,.5); position: relative; }
  .ticket > div { padding: 16px; display: grid; gap: 8px; }
  .perf { height: 0; border-top: 1.5px dashed rgba(107,95,76,.55); margin: 0 16px; position: relative; }
  .perf::before, .perf::after { content: ""; position: absolute; top: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); }
  .perf::before { left: -27px; } .perf::after { right: -27px; }
  .ticket .kick { color: #6b5f4c; display: flex; justify-content: space-between; }
  .ticket .thumbs img { border: 3px solid #fffdf6; } .ticket .thumbs img:nth-child(odd) { transform: rotate(-2deg); } .ticket .thumbs img:nth-child(even) { transform: rotate(2deg); }

  /* B: scrapbook journal */
  .B { --bg:#efe7d6; --panel:#fffdf6; --text:#2b2520; --dim:#6f6558; --accent:#c8553d; --frame-off:#fffdf6;
    --display: "Bodoni 72", Didot, serif; --hand: "Bradley Hand", cursive;
    --btn:#2b2520; --btn-text:#efe7d6; --btn-font:600 16px "Bradley Hand", cursive; --btn-ls:.02em; --btn-r:4px; --btn-shadow:3px 3px 0 #c8553d; --btn-border:0;
    --frame-w:6px; --frame-pad:0; --frame-r:1px; --img-r:0; --on-shadow:0 6px 14px rgba(0,0,0,.25); --off-op:.75; --check-text:#fff;
    --track:#e3d9c4; --card-text:#2b2520; --card-dim:#6f6558; }
  .B.phone { background-image: repeating-linear-gradient(0deg, transparent 0 27px, rgba(43,37,32,.07) 27px 28px); }
  .B .art { box-shadow: 0 3px 8px rgba(0,0,0,.18); border-bottom-width: 18px; }
  .B .art:nth-child(odd) { transform: rotate(-2.5deg); } .B .art:nth-child(even) { transform: rotate(2deg); }
  .B .art.on::before, .B .tape { content: ""; position: absolute; left: 50%; top: -14px; width: 70px; height: 20px; margin-left: -35px;
    background: rgba(200,85,61,.55); transform: rotate(-4deg); }
  .B .tape { background: rgba(232,196,122,.75); }
  .B .stamp { position: absolute; right: 18px; top: 60px; width: 76px; height: 76px; border: 2px solid #c8553d; border-radius: 50%; color: #c8553d;
    font: 700 9px -apple-system; letter-spacing: .14em; display: grid; place-items: center; text-align: center; transform: rotate(14deg); opacity: .8; }
  .B .name { border-bottom: 2px dotted #2b2520; font: 24px "Bradley Hand", cursive; padding: 8px 0; margin: 6px 0 16px; }
  .B .page { background: #fffdf6; padding: 16px; display: grid; gap: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.18); transform: rotate(1deg); position: relative; }
  .B .tab { position: absolute; right: -8px; top: 26px; background: #4cc9d8; color: #05363c; font: 700 9px -apple-system; letter-spacing: .1em; padding: 5px 8px; }

  /* C: pocket pet */
  .C { --bg:#cdb8f2; --panel:#fff; --text:#2c1f4a; --dim:#5b4b82; --accent:#ff6fa3; --frame-off:#2c1f4a;
    --display: "Arial Rounded MT Bold", "Chalkboard SE", sans-serif; --hand: "Chalkboard SE", "Marker Felt", sans-serif;
    --btn:#ffd447; --btn-text:#2c1f4a; --btn-font:700 16px "Arial Rounded MT Bold", sans-serif; --btn-ls:.02em; --btn-r:18px; --btn-shadow:0 5px 0 #2c1f4a; --btn-border:3px solid #2c1f4a;
    --frame-w:3px; --frame-pad:0; --frame-r:18px; --img-r:14px; --on-shadow:0 5px 0 #ff6fa3; --off-op:1; --check-text:#fff;
    --track:#e9defc; --card-text:#2c1f4a; --card-dim:#5b4b82; }
  .C.phone { background: radial-gradient(circle at 30% 12%, #e7d9ff, #cdb8f2 55%, #b79be8); }
  .C .btn.ghost { border: 3px solid #2c1f4a; color: #2c1f4a; background: #fff; box-shadow: 0 5px 0 #2c1f4a; }
  .C .art.on { border-color: #ff6fa3; }
  /* D: B + C. Scrapbook paper, with the pocket pet living on the page as a taped-in sticker */
  .D { --accent:#ff6fa3; --btn:#ffd447; --btn-text:#2b2520; --btn-font:700 16px "Arial Rounded MT Bold", sans-serif; --btn-r:16px;
    --btn-shadow:0 5px 0 #2b2520; --btn-border:3px solid #2b2520; }
  .D .btn.ghost { border: 3px solid #2b2520 !important; color: #2b2520; background: #fffdf6; box-shadow: 0 5px 0 #2b2520; }
  .D .art.on::before { background: rgba(205,184,242,.85); }
  .D .tape { background: rgba(205,184,242,.85); }
  .D .lcd { border-color: #2b2520 !important; box-shadow: inset 0 0 0 3px #9cc088, 4px 5px 0 #2b2520 !important; transform: rotate(-2deg); position: relative; }
  .D .lcd::before { content: ""; position: absolute; left: 50%; top: -15px; width: 80px; height: 22px; margin-left: -40px; background: rgba(255,111,163,.6); transform: rotate(3deg); }
  .D .say { font: 19px/24px "Bradley Hand", cursive; color: #2b2520; background: #fffdf6; padding: 8px 12px; border-radius: 14px 14px 14px 2px;
    box-shadow: 0 3px 8px rgba(0,0,0,.15); align-self: flex-start; margin: 10px 0 0 26px; transform: rotate(1deg); }
  .D .dots { display: flex; gap: 22px; justify-content: center; margin-top: 16px; } .D .dots i { width: 26px; height: 26px; border-radius: 50%; background: #ff6fa3; border: 3px solid #2b2520; box-shadow: 0 4px 0 #2b2520; }
  .D .dots i:nth-child(2) { background: #ffd447; transform: translateY(7px); } .D .dots i:nth-child(3) { background: #6fe0c8; }
  .D .name { border: 0; border-bottom: 2px dotted #2b2520; }

  .C .lcd, .D .lcd { background: #b9d7a3; border: 4px solid #2c1f4a; border-radius: 22px; padding: 14px; display: grid; place-items: center; gap: 6px;
    box-shadow: inset 0 0 0 3px #9cc088, 0 6px 0 #2c1f4a; color: #23401c; font: 700 12px "Courier New", monospace; letter-spacing: .08em; }
  .C .lcd canvas, .D .lcd canvas { image-rendering: pixelated; width: 132px; height: 132px; animation: bob 1.1s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .C .name { background: #fff; border: 3px solid #2c1f4a; border-radius: 16px; font: 20px "Arial Rounded MT Bold", sans-serif; padding: 12px 14px; margin: 6px 0 16px; }
  .C .card { background: #fff; border: 3px solid #2c1f4a; border-radius: 22px; padding: 16px; display: grid; gap: 8px; box-shadow: 0 6px 0 #2c1f4a; }
  .C .thumbs img { width: 40px; height: 40px; border-radius: 12px; border: 2px solid #2c1f4a; }
  .C .dots { display: flex; gap: 22px; justify-content: center; margin-top: 16px; } .C .dots i { width: 30px; height: 30px; border-radius: 50%; background: #ff6fa3; border: 3px solid #2c1f4a; box-shadow: 0 4px 0 #2c1f4a; }
  .C .dots i:nth-child(2) { background: #ffd447; transform: translateY(8px); } .C .dots i:nth-child(3) { background: #6fe0c8; }
</style>
</head>
<body>
<h2>A · Night gallery <small>built in app/src now: navy hall, brass frames that light up, paper tickets</small></h2>
<div class="row" id="A"></div>
<h2>B · Scrapbook journal <small>cream paper, taped prints, stamps, handwriting</small></h2>
<div class="row" id="B"></div>
<h2>C · Pocket pet <small>pastel handheld, LCD screen with the pixel beaver, chunky candy buttons</small></h2>
<div class="row" id="C"></div>

<script>
const IMG = ["aic-9148", "aic-16794", "aic-14311", "aic-9", "aic-22857"].map((n) => `mock-art/${n}.jpg`);
const VARS = [["Warmth", "cool / warm", 32], ["Brightness", "dark / bright", 58], ["Saturation", "muted / vivid", 44],
  ["Detail", "sparse / detailed", 71], ["Palette", "broad / focused", 63], ["Era", "older / newer", 39]];
const bars = VARS.map(([n, e, v]) => `<div><div class="bl"><span>${n}</span><span>${e}</span></div><div class="bar"><b style="width:${v}%"></b></div></div>`).join("");
const thumbs = `<div class="thumbs">${IMG.map((s) => `<img src="${s}">`).join("")}</div>`;
const grid = `<div class="grid">${IMG.slice(0, 4).map((s, i) =>
  `<div class="art ${i === 0 || i === 3 ? "on" : ""}"><img src="${s}">${i === 0 || i === 3 ? '<span class="check">✓</span>' : ""}</div>`).join("")}</div>`;
const pips = `<div class="pips"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>`;
const meta = "9 artworks · landscape, water · mostly oil · blue and green tones";

const screens = {
  A: [
    `<div class="glow"></div><div class="sp"></div><div class="kick">A NIGHT GALLERY FOR TWO</div>
     <div class="title" style="font-size:88px;line-height:96px">Blend</div><div class="rule"></div>
     <p class="dim">Build a gallery in five quick rooms, blend it with a friend's, and watch a new painting paint itself.</p><div class="sp"></div>
     <div style="font:19px 'Bradley Hand',cursive;color:#d9b56d">What should we call you?</div><div class="name">Jakhangir</div><div class="btn">START THE QUIZ</div>`,
    `${pips}<div class="kick">ROOM 2 OF 5</div><div class="title" style="font-size:30px;line-height:36px;margin:6px 0 16px">Tap every one you like.</div>${grid}
     <div class="sp"></div><div class="hand" style="margin-bottom:10px">2 on your wall</div><div class="nav"><div class="btn ghost">BACK</div><div class="btn">NEXT</div></div>`,
    `<div class="title" style="font-size:22px;margin-bottom:26px">Jakhangir's gallery</div>
     <div class="ticket"><div><div class="kick"><span>YOUR GALLERY</span><span>ADMIT ONE</span></div>
     <div style="font:29px/33px Didot,serif">Cool Tidewatcher</div><div style="font-size:12px;color:#6b5f4c">${meta}</div>${thumbs}</div>
     <div class="perf"></div><div><div style="font:16px 'Bradley Hand',cursive;color:#6b5f4c">what your walls say</div><div class="bars">${bars}</div></div></div>
     <div class="sp"></div><div class="btn">BLEND WITH A FRIEND</div>`,
  ],
  B: [
    `<div class="stamp">ADMIT<br>ONE<br>· 2026 ·</div><div class="sp"></div><div class="kick">AN ART TASTE JOURNAL</div>
     <div class="title" style="font-size:84px;line-height:92px;font-style:italic">Blend</div>
     <p class="dim" style="font-family:'Bradley Hand',cursive;font-size:18px">Fill five pages with art you like, swap journals with a friend, and watch a new painting paint itself.</p><div class="sp"></div>
     <div class="kick" style="color:#6f6558">THIS JOURNAL BELONGS TO</div><div class="name">Jakhangir</div><div class="btn">Start the quiz →</div>`,
    `${pips}<div class="kick">PAGE 2 OF 5</div><div class="title" style="font-size:30px;line-height:36px;margin:6px 0 20px;font-style:italic">Tape in the ones you like.</div>${grid}
     <div class="sp"></div><div class="hand" style="margin-bottom:10px">2 taped in</div><div class="nav"><div class="btn ghost" style="border:2px solid #2b2520;color:#2b2520">Back</div><div class="btn">Next page →</div></div>`,
    `<div class="title" style="font-size:22px;margin-bottom:30px;font-style:italic">Jakhangir's journal</div>
     <div class="page"><span class="tape"></span><span class="tab">TASTE</span><div class="kick">YOUR GALLERY</div>
     <div style="font:italic 30px/34px 'Bodoni 72',serif">Cool Tidewatcher</div><div style="font:15px 'Bradley Hand',cursive;color:#6f6558">${meta}</div>${thumbs}
     <div class="bars" style="margin-top:6px">${bars}</div></div><div class="sp"></div><div class="btn">Blend with a friend →</div>`,
  ],
  C: [
    `<div class="lcd"><canvas width="16" height="16"></canvas><div>HELLO! I'M YOUR TASTE PET</div></div><div class="dots"><i></i><i></i><i></i></div><div class="sp"></div>
     <div class="title" style="font-size:54px;line-height:58px">Blend</div>
     <p class="dim">Feed your beaver the art you like. Blend it with a friend's and watch a new painting paint itself.</p><div class="sp"></div>
     <div class="kick" style="color:#2c1f4a">NAME YOUR KEEPER</div><div class="name">Jakhangir</div><div class="btn">Start the quiz</div>`,
    `${pips}<div class="kick" style="color:#2c1f4a">ROUND 2 OF 5</div><div class="title" style="font-size:26px;line-height:31px;margin:6px 0 16px">Feed me the ones you like!</div>${grid}
     <div class="sp"></div><div class="hand" style="margin-bottom:12px">yum, 2 so far</div><div class="nav"><div class="btn ghost">Back</div><div class="btn">Next</div></div>`,
    `<div class="lcd" style="grid-auto-flow:column;justify-content:start;padding:8px 14px"><canvas width="16" height="16" style="width:56px;height:56px"></canvas><div>LV 3 · COOL TIDEWATCHER</div></div>
     <div class="card" style="margin-top:18px"><div class="kick">YOUR GALLERY</div><div class="title" style="font-size:24px">Cool Tidewatcher</div>
     <div style="font-size:12px;color:#5b4b82">${meta}</div>${thumbs}<div class="bars">${bars}</div></div><div class="sp"></div><div class="btn">Blend with a friend</div>`,
  ],
  D: [
    `<div class="lcd" style="margin-top:14px"><canvas width="16" height="16"></canvas></div><div class="dots"><i></i><i></i><i></i></div>
     <div class="say">hi! show me art you like<br>and I'll keep it in here</div><div class="sp"></div>
     <div class="title" style="font-size:72px;line-height:78px;font-style:italic">Blend</div>
     <div class="kick" style="color:#6f6558;margin-top:14px">THIS JOURNAL BELONGS TO</div><div class="name">Jakhangir</div><div class="btn">Start the quiz</div>`,
    `${pips}<div style="display:flex;gap:12px;align-items:center;margin-bottom:20px">
     <div class="lcd" style="padding:6px;border-radius:14px;border-width:3px"><canvas width="16" height="16" style="width:48px;height:48px"></canvas></div>
     <div><div class="kick">PAGE 2 OF 5</div><div class="title" style="font-size:25px;line-height:29px;font-style:italic;margin-top:4px">Tape in the ones you like.</div></div></div>${grid}
     <div class="sp"></div><div class="hand" style="margin-bottom:12px">yum, 2 taped in</div><div class="nav"><div class="btn ghost">Back</div><div class="btn">Next page</div></div>`,
    `<div style="display:flex;gap:12px;align-items:center;margin-bottom:26px">
     <div class="lcd" style="padding:6px;border-radius:14px;border-width:3px"><canvas width="16" height="16" style="width:48px;height:48px"></canvas></div>
     <div class="say" style="margin:0;font-size:16px;line-height:20px">your walls feel cool<br>and watery today</div></div>
     <div class="page"><span class="tape"></span><span class="tab">TASTE</span><div class="kick">YOUR GALLERY</div>
     <div style="font:italic 30px/34px 'Bodoni 72',serif">Cool Tidewatcher</div><div style="font:15px 'Bradley Hand',cursive;color:#6f6558">${meta}</div>${thumbs}
     <div class="bars" style="margin-top:6px">${bars}</div></div><div class="sp"></div><div class="btn">Blend with a friend</div>`,
  ],
};
// ?only=B shows a single style (handy for screenshots)
const only = new URLSearchParams(location.search).get("only");
if (only) document.querySelectorAll(".row, h2").forEach((el) => {
  const id = el.id || el.nextElementSibling.id;
  if (id !== only) el.style.display = "none";
});
for (const k of Object.keys(screens)) {
  if (!document.getElementById(k)) continue; // D (the B+C hybrid) is kept in the data but not shown: the owner chose separate styles
  document.getElementById(k).innerHTML = screens[k].map((h) => `<div class="phone ${k === "D" ? "B D" : k}">${h}</div>`).join("");
}

// 16x16 pixel beaver for the LCD: . empty, k outline, b fur, c belly, t teeth, p palette tail, r/y paint dabs
const BEAVER = [
  "................", "...kk......kk...", "..kbbkkkkkkbbk..", "..kbbbbbbbbbbk..", ".kbbbbbbbbbbbbk.", ".kbbkbbbbbbkbbk.",
  ".kbbbbbkkbbbbbk.", ".kbbbcckkccbbbk.", ".kbbbccttccbbbk.", "..kbbcccccbbk...", "..kbbcccccbbkkk.", ".kbbbcccccbbkppk",
  ".kbbbbcccbbbkrpk", "..kbbbbbbbbkpypk", "..kkbkkkkbkkkkk.", "...kk....kk.....",
];
const INK = { k: "#23401c", b: "#5f8a4b", c: "#9cc088", t: "#e9f5dc", p: "#7fa56a", r: "#23401c", y: "#e9f5dc" };
document.querySelectorAll(".lcd canvas").forEach((cv) => {
  const g = cv.getContext("2d");
  BEAVER.forEach((line, y) => [...line].forEach((ch, x) => { if (INK[ch]) { g.fillStyle = INK[ch]; g.fillRect(x, y, 1, 1); } }));
});
</script>
</body>
</html>
